[package]
name = "invisible-watermark"
description = "Hide a short text watermark in an image, in the least significant bits or in a mode that survives JPEG and resizing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["watermark", "steganography", "image", "lsb", "encryption"]
categories = ["multimedia::images"]

[dependencies]
image.workspace = true
thiserror.workspace = true
crc32fast.workspace = true
argon2.workspace = true
chacha20.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true

[dev-dependencies]
image = { workspace = true, features = ["jpeg"] }
