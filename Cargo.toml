[workspace]
members = ["crates/invisible-watermark", "crates/iwm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ataoytun/InvisibleWatermark"

[workspace.dependencies]
invisible-watermark = { path = "crates/invisible-watermark" }
image = { version = "0.25.10", default-features = false }
thiserror = "2.0.21"
crc32fast = "1.5.2"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
chacha20 = { version = "0.10.2", default-features = false, features = ["cipher"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
